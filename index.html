<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アプローチブック トークスクリプト｜ViVi不動産</title>
<style>
:root{
  --navy:#1B2A52; --navy2:#24356B; --navy-soft:#EDF1FA;
  --ink:#232A3E; --muted:#66708C;
  --paper:#F6F7FB; --card:#FFFFFF;
  --orange:#EE7228; --orange-deep:#D85F17; --orange-soft:#FDEDE0;
  --line:#DDE2F0; --ok:#2E7D5B;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic",Meiryo,sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.75;
  padding-bottom:64px;
}
/* ---------- header ---------- */
.hero{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 78%);
  color:#fff;padding:26px 18px 20px;
}
.hero .brand{
  font-size:11px;letter-spacing:.22em;color:#B9C4E4;font-weight:700;
}
.hero h1{
  font-size:21px;font-weight:800;letter-spacing:.02em;margin-top:6px;line-height:1.4;
}
.hero h1 .accent{color:#FFB37E}
.hero .sub{font-size:12px;color:#C7D0EA;margin-top:8px}
.hero .legend{
  margin-top:12px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);
  border-radius:10px;padding:9px 12px;font-size:12px;color:#E8ECF8;
}
.hero .legend .ask-demo{
  color:#FFB37E;font-weight:700;border-bottom:2px solid var(--orange);padding-bottom:1px;
}
/* ---------- flow rail ---------- */
.rail{
  display:flex;gap:6px;overflow-x:auto;padding:14px 14px 4px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.rail::-webkit-scrollbar{display:none}
.rail .stage{
  flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:8px 12px;min-width:112px;
}
.rail .stage .t{font-size:11px;font-weight:800;color:var(--navy)}
.rail .stage .m{font-size:11px;color:var(--muted)}
.rail .stage .bar{height:4px;border-radius:2px;background:var(--navy-soft);margin-top:6px;position:relative;overflow:hidden}
.rail .stage .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--orange);border-radius:2px}
/* ---------- toolbar ---------- */
.toolbar{
  position:sticky;top:0;z-index:30;background:var(--paper);
  padding:10px 14px 12px;border-bottom:1px solid var(--line);
}
.search{position:relative}
.search input{
  width:100%;padding:11px 14px 11px 40px;border:1.5px solid var(--line);border-radius:24px;
  font-size:15px;background:var(--card);color:var(--ink);outline:none;
}
.search input:focus{border-color:var(--orange)}
.search .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--navy);
  font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:20px;cursor:pointer;
  white-space:nowrap;
}
.tab.active{background:var(--navy);border-color:var(--navy);color:#fff}
.count{font-size:11.5px;color:var(--muted);margin-top:8px}
/* ---------- cards ---------- */
main{padding:14px 14px 0;max-width:760px;margin:0 auto}
.blockhead{
  margin:22px 2px 10px;display:flex;align-items:baseline;gap:8px;
}
.blockhead .bk{
  font-size:12px;font-weight:800;color:#fff;background:var(--navy);
  border-radius:6px;padding:2px 9px;letter-spacing:.08em;
}
.blockhead h2{font-size:15.5px;color:var(--navy);font-weight:800}
.blockhead .bmin{font-size:12px;color:var(--orange-deep);font-weight:700;margin-left:auto}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:14px;overflow:hidden;
}
.card-h{
  display:flex;align-items:flex-start;gap:12px;padding:14px 16px 12px;
  border-bottom:1px solid var(--line);
}
.num{
  flex:0 0 auto;width:46px;height:46px;border-radius:11px;background:var(--navy);
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.num .l{font-size:8px;letter-spacing:.14em;color:#9FB0DE;font-weight:700;line-height:1}
.num .n{font-size:19px;font-weight:800;line-height:1.15}
.card-h .ttl{flex:1;min-width:0}
.card-h h3{font-size:15.5px;font-weight:800;color:var(--navy);line-height:1.45}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{
  font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 7px;line-height:1.5;
}
.chip.time{background:var(--navy-soft);color:var(--navy)}
.chip.insert{background:#FFF6D9;color:#8A6D00}
.chip.close{background:var(--orange);color:#fff}
.chip.rest{background:#E3F3EB;color:var(--ok)}
.chip.custom{background:#F0E4F7;color:#6B3E8C}
.card-b{padding:4px 16px 14px}
.sec{margin-top:13px}
.sec .lab{
  font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--muted);
  display:flex;align-items:center;gap:6px;margin-bottom:5px;
}
.sec .lab::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--orange)}
.sec.goal .lab::before{background:var(--navy)}
.goal p{font-size:13.5px;font-weight:700;color:var(--navy);background:var(--navy-soft);border-radius:9px;padding:9px 12px}
.talk{
  background:#F4F7FE;border-radius:11px;padding:12px 14px;font-size:14px;line-height:2.0;
}
.talk .ask{color:var(--orange-deep);font-weight:800;border-bottom:2px solid var(--orange);padding-bottom:1px}
.talk b{color:var(--navy)}
.pts{list-style:none}
.pts li{
  position:relative;padding-left:18px;font-size:13px;color:#3A4258;margin-bottom:6px;line-height:1.7;
}
.pts li::before{content:"◆";position:absolute;left:0;top:0;color:var(--orange);font-size:10px;line-height:2.1}
.pts li b{color:var(--navy)}
details.faq{
  border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:#FCFCFE;overflow:hidden;
}
details.faq summary{
  list-style:none;cursor:pointer;padding:9px 12px;font-size:13px;font-weight:700;color:var(--navy);
  display:flex;gap:8px;align-items:flex-start;
}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::before{
  content:"Q";flex:0 0 auto;width:20px;height:20px;border-radius:6px;background:var(--navy);
  color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;
}
details.faq[open] summary{border-bottom:1px dashed var(--line)}
details.faq .a{
  padding:9px 12px 11px 40px;font-size:13px;color:#3A4258;position:relative;line-height:1.85;
}
details.faq .a::before{
  content:"A";position:absolute;left:12px;top:11px;width:20px;height:20px;border-radius:6px;
  background:var(--orange);color:#fff;font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}
.note{
  margin-top:12px;background:var(--orange-soft);border-radius:9px;padding:9px 12px;
  font-size:12.5px;color:#7A4212;line-height:1.7;
}
.note b{color:var(--orange-deep)}
/* ---------- update table ---------- */
.upd{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.upd h3{font-size:15px;color:var(--navy);font-weight:800;margin-bottom:4px}
.upd .asof{font-size:12px;color:var(--orange-deep);font-weight:700;margin-bottom:10px}
.upd table{width:100%;border-collapse:collapse;font-size:12.5px}
.upd th{
  text-align:left;background:var(--navy);color:#fff;padding:7px 9px;font-size:11.5px;letter-spacing:.05em;
}
.upd td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.6}
.upd td.s{white-space:nowrap;font-weight:800;color:var(--navy)}
.upd .memo{margin-top:12px;font-size:12.5px;color:#3A4258;background:var(--navy-soft);border-radius:9px;padding:10px 12px;line-height:1.8}
.hidden{display:none!important}
.empty{
  text-align:center;color:var(--muted);font-size:13.5px;padding:40px 0;
}
footer{
  text-align:center;font-size:11px;color:var(--muted);padding:26px 14px 10px;
}
/* ---------- print ---------- */
@media print{
  body{background:#fff;padding-bottom:0}
  .toolbar,.rail,.hero .legend{display:none}
  .hero{background:var(--navy)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card{break-inside:avoid;border-color:#bbb}
}
@media (min-width:700px){
  .hero{padding:34px 24px 24px}
  .hero h1{font-size:25px}
  main{padding-top:18px}
}

/* ===== モード切替タブ ===== */
.modebar{max-width:1100px;margin:0 auto;padding:14px 16px 0;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.modebtn{
  flex:1 1 260px;max-width:420px;font-size:16px;font-weight:800;cursor:pointer;
  padding:14px 18px;border-radius:12px;border:2px solid #d7dde6;background:#fff;color:#8894a2;
  transition:.15s;font-family:inherit;
}
.modebtn:hover{border-color:#E8710A;color:#E8710A}
.modebtn.active{background:linear-gradient(100deg,#1F4E79,#163a5c);border-color:#1F4E79;color:#fff;box-shadow:0 4px 14px rgba(31,78,121,.28)}
@media(max-width:520px){.modebtn{font-size:14px;padding:12px}}

</style>
</head>
<body>

<div class="hero">
  <div class="brand">ViVi FUDOSAN — SALES TALK SCRIPT</div>
  <h1>アプローチブック<br>トークスクリプト <span class="accent">標準版</span></h1>
  <div class="sub">中古×リノベ 初回商談60分｜全スタッフ共通トーク（2026年7月版）</div>
  <div class="legend">
    <span class="ask-demo">オレンジ下線</span> ＝ お客様に必ず投げる質問。一方的な説明を防ぐため、各ページに仕込んであります。答えは必ずメモ。
  </div>
</div>


<div class="modebar">
  <button class="modebtn active" data-mode="buy">🏠 買主向けアプローチ</button>
  <button class="modebtn" data-mode="sell">💰 売主向けアプローチ</button>
</div>

<div class="rail" id="rail"></div>

<div class="toolbar">
  <div class="search">
    <span class="icon">🔍</span>
    <input type="search" id="q" placeholder="スライド番号・キーワード・FAQを検索（例:団信、354、競売）">
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="count" id="count"></div>
</div>

<main id="main"></main>

<footer>ViVi不動産株式会社｜社内用・持ち出し禁止｜数字は「巻末」タブの更新一覧を参照</footer>

<script>
/* ===== 売主向けデータ（買主向けと同一形式）===== */
const BLOCKS_SELL = {
  A:{name:"つかみと信頼構築", min:"約4分", pct:12},
  B:{name:"会社選びの正解を伝える", min:"約8分", pct:26},
  C:{name:"販売戦略と広告力を見せる", min:"約7分", pct:24},
  D:{name:"安心の仕組み（検査・保証・囲い込み防止）", min:"約6分", pct:20},
  E:{name:"価格戦略・売却の流れ・クロージング", min:"約5分", pct:18},
  R:{name:"参考資料（めくるだけ）", min:"必要時のみ", pct:0},
  U:{name:"巻末:よくある質問・運用メモ", min:"—", pct:0}
};

const SLIDES_SELL = [
/* ===== BLOCK A ===== */
{n:"1", block:"A", title:"表紙・5つの宣言", time:"60秒",
 goal:"何屋か・どんな姿勢の会社かを最初の30秒で伝える。「5つの宣言」で“強引に売らない味方”という印象を先に置く。",
 talk:`「本日はお時間をいただきありがとうございます。私どもViVi不動産は、中古住宅・マンションの売買専門店です。まずお伝えしたいのが、この『5つの宣言』です。中でも大事にしているのが<span class="ask">“強引な営業をしない”</span>こと。今日は売却の仕組みを知っていただく場ですので、安心してお聞きください」`,
 pts:["最初に“今日は契約を迫る場ではない”と明言すると、売主様の警戒が一気に解ける。"]},
{n:"2", block:"A", title:"会社紹介・実績（仲介占有率No.1／満足度92.6%／成約139件）", time:"60秒",
 goal:"数字で“実際に売れている会社”だと示す。特に富山市中古マンション仲介占有率No.1が最強の信頼材料。",
 talk:`「富山市の中古マンションの売買仲介では、当社が占有率No.1をいただいております。昨年の成約は139件、お客様満足度は92.6%です。地元富山に密着して、実際に“売れている”という実績があることをまず知っていただければと思います」`,
 pts:["この数字は後半の『査定額でなく販売力で選ぶ』話の伏線。ここで軽く触れておくと後が効く。"]},
{n:"3〜6", block:"R", title:"代表挨拶・スタッフ紹介", time:"めくる", badges:["insert"],
 goal:"基本はめくるだけ。会社の姿勢と体制を軽く伝える。",
 talk:`【P3 代表挨拶】東京・富山で計15年の実績。「夜でも定休日でも対応」「専門用語を使わない」姿勢を一言添える。<br>【P4〜6 スタッフ紹介】「営業・工務あわせて12名体制でチームでお預かりします」と一言。顔写真を見せて安心感を渡す程度でOK。`},

/* ===== BLOCK B ===== */
{n:"7", block:"B", title:"不動産売却7つのポイント", time:"90秒",
 goal:"売却の全体像と“売主に有利な事実”をまとめて渡す。売主の疑問（費用は？リフォームは？）を先回りで解消。",
 talk:`「売却で押さえておきたいポイントを7つにまとめました。特にお伝えしたいのは、①販売価格は売主様が決められること、②広告費は当社が全額負担すること、③かかる費用は最後の残金から差し引くので手出しは原則ゼロ、④リフォームも不要、ということです。つまり<span class="ask">『始めるのにお金はかからない』</span>とお考えください」`,
 pts:["“売主のメリット”が凝縮された重要ページ。①〜④は指差ししながらゆっくり。"],
 faqs:[{q:"契約不適合責任って何ですか?（P7-6）",a:"「お引渡し後に雨漏りや設備の不具合が見つかった場合、一定期間は売主様が責任を負うという決まりです。ただ後ほどご説明する建物検査と保険で、この不安はしっかりカバーできますのでご安心ください」"}]},
{n:"8", block:"B", title:"失敗しない会社選びの5つのポイント", time:"60秒",
 goal:"『どこに頼むか』の判断軸を“こちら側”で設定する。この5軸すべてでViViが勝てる構成になっている。",
 talk:`「会社選びで失敗しないポイントは5つあります。①本当に高く売る実績、②販売戦略と広告力、③地域密着、④リフォーム提案でワクワクさせられるか、⑤困りごとを全部解決できるか。今日はこの5つに沿って、当社がどう違うのかをご説明していきます」`,
 pts:["これは目次の役割。以降の話が『今どのポイントの話か』を意識させると納得感が段違い。"]},
{n:"9", block:"B", title:"査定額が高い会社に飛びつくと失敗する", time:"3分", badges:["close"],
 goal:"★最重要。この1枚が売主向けの最大の山場。『高い査定額＝良い会社ではない』という価値観の転換を起こす。",
 talk:`「ここが一番大事なお話です。よくあるのが、一番高い査定額を出した会社に頼んだのに、いつまでも売れず、ポータルサイトにも載っていない…というケース。実は査定額は“この値段で必ず売れる保証”ではないんです。中には預かりたいがために、わざと高い額を出す会社もあります。ですので<span class="ask">選ぶ基準は査定額ではなく『本当に売れるかどうか＝販売戦略と広告力』で見てください</span>」`,
 pts:["売主が最も勘違いしやすいポイント。ここで腑に落ちると、以降ViViの販売力の話がすべて刺さる。ゆっくり、目を見て。"],
 faqs:[{q:"でも高く売れるなら高い査定の会社がいいのでは?",a:"「おっしゃる通り高く売れるのが一番です。ただ“査定額”と“実際に売れる額”は別物なんです。高く出しすぎると売れ残り、結局『値下げの繰り返し』で相場より安くなることも。当社は『高く出す』のではなく『高く売り切る』ことをお約束します」"}]},
{n:"10〜11", block:"B", title:"任せたら危険な不動産会社のポイント", time:"90秒",
 goal:"危険な会社の特徴を挙げ、消去法でViViを選ばせる。全部読まず“あるある”を2〜3個ピックして共感を得る。",
 talk:`「逆に、こういう会社は要注意です。相場よりずっと高い査定を出す会社、手数料の大幅値引きをアピールする会社、ホームページが更新されていない会社。特に手数料の値引きは、集客力に自信がない裏返しのことが多いんです。安くなった手数料以上に、売却額が下がってしまっては元も子もありません」`,
 pts:["P11の『大手だから安心とは限らない』は、大手と迷っている売主に効く。相手が大手検討中なら重点的に。"]},
{n:"12〜13", block:"B", title:"本当に高く売れる会社（ワンストップ・物件情報量・12名体制）", time:"90秒",
 goal:"“買い手を自社で見つけられる力”がViViの強み。買主にワンストップ提案できる＝中古でも売れる、を示す。",
 talk:`「当社は買いたいお客様に、物件探しからリフォーム、ローン、登記まで全部ワンストップでご提案できます。だから中古物件でも“買いたい”に繋げやすいんです。公開物件は80件以上、営業・工務12名体制。富山市エリアで最大級の情報量があるからこそ、『高く・早く・売れる』んです」`},
{n:"14", block:"B", title:"70件 or 10件、あなたはどちらを選ぶ?", time:"60秒",
 goal:"問い合わせ数の差を体感させる。“広告費・営業数・掲載数が多い会社＝問い合わせが多い”を印象づける。",
 talk:`「<span class="ask">もし1ヶ月の問い合わせが70件ある会社と、10件の会社があったら、どちらに任せたいですか?</span>…そうですよね。この差を生むのが、広告費・営業マンの数・ポータル掲載数です。当社はこの3つに力を入れているので、買い手からのお問い合わせが集まりやすいんです」`,
 pts:["売主に問いかけて“70件”と答えてもらう。自分で選んだ感覚が納得に変わる。"]},
{n:"15〜17", block:"R", title:"イベントチラシ・販売活動の違い・契約実績グラフ", time:"めくる", badges:["insert"],
 goal:"P15はめくる、P16・17は軽く触れる。",
 talk:`【P15】「こういう集客イベントも開催しています」と見せるだけ。<br>【P16 販売活動の違い】「他社は媒介契約後2週間かかることも。当社は即レインズ登録・1週間以内にポータル掲載」とスピードの違いを強調。<br>【P17 契約実績】「マンション36.4%はダントツ。土地・戸建も伸びています」と数字だけ示す。`},

/* ===== BLOCK C ===== */

{n:"15", block:"B", title:"リノベーション済み物件の購入は損??（差額363万円）", time:"2分半",
goal:"「リノベ済み再販物件を買うと363万円損」を理解してもらい、「自分で選んでリノベする」方向へ確定させる。",
talk:`「at homeやスーモを見ていると『リノベーション済み・すぐ住めます』という綺麗な物件がありますよね。実はあれ、同じリノベ内容でも363万円高くつくんです。理由は、販売会社の利益（250万円）と販促費（50万円）が乗っていること、建物に消費税がかかること、リノベ後の価格で仲介手数料を計算されること。この上乗せです。合計すると、自分で買ってリノベなら1,916万円のところ、リノベ済みだと2,279万円。しかも間取りも内装も他人が決めたもの。ご自身で中古を買ってからリノベすれば、363万円安く、しかも100%○○様の好みにできます。<span class="ask">同じお金を払うなら、どちらがいいですか？</span>」`,
pts:["競合はまさに「リノベ済み再販物件」。<b>商談の勝敗を分ける重要ページ。</b>","「綺麗ですぐ住める」の魅力を認めた上で（否定から入らない）、金額と自由度の2軸で崩す。","<b>【社内統一】棲み分けトーク:</b>お急ぎの方・リノベの打合せが面倒だという方には再販物件。時間がある方・自分らしいオリジナルのお家を作りたい方には中古×リノベ。※自社（ViVi・ゆかり）の再販在庫を否定しない言い回しを徹底。"],
faqs:[{q:"でもリノベ済みならすぐ住めるよね?",a:"「おっしゃる通り、入居はお急ぎの度合い次第です。当社の場合、購入からリノベ完成まで約3〜4ヶ月。この期間で363万円と『自分好みの家』が手に入ると考えると、待つ価値はあると思いませんか？」"},{q:"ViViさんも買取再販やってるよね?",a:"（正直に）「やっています。お急ぎの方や、リノベの打合せはちょっと面倒だなという方には、プロが仕上げた再販物件はとても良い選択肢です。一方、時間をかけられる方、自分らしいオリジナルのお家を作りたい方には、ご自身で選んでリノベする方が確実にお得です。今日は後者のお話をしています」"}]},

{n:"16", block:"B", title:"中古リノベ物件と建売物件の比較！", time:"90秒",
goal:"「同じ予算帯なら、中古リノベは立地・広さ・自由度の全てで勝つ」を体感してもらう。",
talk:`「今度は新築建売と比べてみます。建売は3,200万円で郊外・28坪前後・間取りは決まったもの。中古リノベなら1,770万円（物件1,000万＋リノベ770万）で好立地・32坪以上・間取りも内装も自由。1,400万円以上安くて、街中に住めて、広くて、自分好みなんです。<span class="ask">○○様は、どちらに住んでみたいですか？</span>」`,
pts:["価格だけでなく<b>「立地」を強調</b>する（建売は土地が安い郊外にしか建たない構造的な理由がある）。","エリアの希望は既にお伺いしているので、ここでは「どちらに住みたいか」とイメージを膨らませる問いかけにする。"],
faqs:[{q:"新築の保証や設備の方が安心では?",a:"「設備はリノベで全部新品にできますし、当社は工事保証もアフターサービスもあります（→24の伏線）。違いは『建物の骨組みが新品かどうか』だけ。その骨組みに1,400万円払うかどうか、というお話なんです」"}]},

{n:"17", block:"B", title:"資産価値グラフ（中古リノベ vs 建売）", time:"90秒",
goal:"16の比較を「買った後の資産価値」の時間軸で駄目押しする。",
talk:`「さっきの2つの家、買った後どうなるかがこのグラフです。建売新築は建物2,000万円の価値が築25年でゼロになっていきます。つまり毎年80万円ずつ溶けていく計算です。一方、中古リノベは建物価値がすでにゼロの物件（土地1,000万＋リノベ770万）を買っているので、下がりようがない。土地の価値だけがしっかり残ります。<span class="ask">どちらの線の上で暮らしたいですか？</span>」`,
pts:["<b>「毎年80万円ずつ溶ける」</b>という年割り換算が最も刺さる表現。","「建物価値ゼロの物件=下がりようがない」はネガティブ情報をポジティブに反転させる決めゼリフ。"],
faqs:[{q:"リノベにかけた770万円の価値も残らないのでは?",a:"「正直に申し上げると、リノベ費用も市場価値としては残りにくいです。ただ、そもそも建売との差額1,400万円の中に収まっているので、全額失っても建売より得、という構造です。それに快適に暮らせる価値はしっかり残ります」"}]},

{n:"18", block:"B", title:"中古を買ったらリノベが当たり前（問題提起）", time:"30秒",
goal:"「中古を買う人はほぼ全員リノベする。でも満足していない人が多い」という問題提起で、次ページへの緊張感を作る。",
talk:`「データを見ると、中古を買った方のほとんどがリノベーションをしています。ここまでのお話で、中古×リノベがお得なのはご理解いただけたと思います。ただ、一つ気になるデータがあって…リノベした人の満足度が意外と低いんです。<span class="ask">なぜだと思いますか？</span>」`,
pts:["ここから2枚は「不安喚起→解決（ワンストップ）」の入口。順調に納得が進んでいるお客様にあえてブレーキをかけることで、ブロックCが「売り込み」ではなく「解決策」として聞こえる。","「なぜだと思いますか？」で一度考えさせてから次ページへ。"],
faqs:[]},

{n:"19", block:"B", title:"リノベーションに満足しない理由（4つの失敗）", time:"2分",
goal:"失敗の4パターン（思い通りにならない・購入後トラブル・予算オーバー・見積りが遅い）を自分ごと化してもらう。",
talk:`「理由はこの4つです。①思った通りのリノベができない…物件を買った後で『この壁は抜けません』が発覚するケース。②購入後のトラブル…雨漏りやシロアリが後から見つかる。③物件とリノベの総額が予算オーバー…別々に話が進むと、合計したら毎月のローン返済が家計を圧迫していた、という失敗。④見積りが出てくるのが遅くて、待っている間に物件が売れてしまった。実はこの4つ、全部同じ原因なんです。<span class="ask">何だと思いますか？</span>…『不動産屋とリノベ会社が別々』だからなんです」`,
pts:["4つの失敗を<b>「バラバラの窓口」という一つの原因に収束</b>させるのがこのページの技術。ここが決まると次のワンストップが「唯一の解決策」として自然に受け入れられる。","③の「返済が家計を圧迫」はスライド5の「我慢する生活」と呼応させる。"],
faqs:[{q:"大手のリノベ会社に頼めば安心では?",a:"「リノベの技術は安心かもしれません。ただ物件選びの段階から関わってもらえないと、①と②のリスクは残ります。『この物件はリノベに向くか』を購入前に判断できる体制が大事なんです」"}]},

/* ================= BLOCK C ================= */
{n:"20", block:"C", title:"ワンストップサービスとは", time:"30秒",
goal:"19の4つの失敗の解決策=ワンストップ、と一言で腹落ちさせる。",
talk:`「さっきの4つの失敗を防ぐ方法はシンプルで、物件探しとリノベーションを同じ会社に任せることです。これをワンストップサービスと言います。物件を見るときからリノベのプロが一緒なら、『壁が抜けない』も『雨漏り』も買う前に分かる。予算も1つの窓口で管理するからオーバーしない。見積りも自社だから速い。4つの失敗が全部消えるんです」`,
pts:["19の4項目と<b>1対1で対応</b>させて話す（①→買う前に分かる、②→診断で分かる、③→1つの窓口、④→自社だから速い）。","新しい情報は足さず「解決した」という快感だけを作る30秒ページ。"],
faqs:[{q:"ワンストップの会社なら他にもあるよね?",a:"「あります。ただ実は『ワンストップ』には本物と偽物があるんです。次のページでご説明しますね（→21へ）」"}]},

{n:"21", block:"C", title:"偽ワンストップサービスとは!?（自社施工＋分離発注）", time:"2分",
goal:"「ワンストップを名乗る会社の多くは外注仲介で、紹介手数料分お客様が損している」と知ってもらい、「自社施工」を選択基準に刷り込む。",
talk:`「実は『ワンストップ対応』と書いてあっても、リノベは外部の工務店に丸投げして、紹介手数料をもらっている会社が少なくありません。その手数料、<span class="ask">どこから出ていると思いますか？</span>…そうです、工事費に上乗せされて、結局お客様が払っているんです。当社は設計も施工も自社。中間マージンがゼロなので、同じ予算ならその分をキッチンのグレードアップや床材に回せます。同じ700万円の工事でも、中身が変わってくるんです」`,
pts:["「どこから出ていると思いますか?」でお客様に答えさせてから種明かしする。","「マージンが無い」で終わらせず<b>「その分リノベの中身が良くなる」</b>という得の言い換えまでセットで。","他社を「偽物」と断定する口調は避け、「そういう仕組みの会社もある」に留める。"],
faqs:[{q:"自社施工ってことは職人さんも社員なの?",a:"「設計・施工管理は当社スタッフで、工事は長年組んでいる専属の協力業者です。さらに大工さん・配管業者さん・電気業者さんなどに当社が直接分離発注することで、一括で工務店に出すより単価を下げる努力をしています。中間マージンを抜くだけでなく、発注の仕方でもコストを下げているんです」※「分離発注」と言ったら「工事をまとめて丸投げせず、職種ごとに当社が直接手配する方式です」と一言添える。"},{q:"自社施工だと割高になったりしない?",a:"「逆です。外注仲介だと工務店の利益＋紹介手数料の二重構造ですが、当社は一重、しかも分離発注で単価を下げています。見積りを他社と比べていただいて構いません」"}]},

{n:"22", block:"C", title:"ViVi不動産のお好みリノベ診断（5分・その場で体験）", time:"5分", badges:["rest"],
goal:"「うちにはどんな住まいが合う?」をその場で診断し、リノベを自分ごと化。座学の中だるみ解消も兼ねる。※新規追加ページ。",
talk:`「ここで少し手を動かしていただきましょう。『うちには、どんなリノベ・どんな住まいが合うんだろう?』の答えを、5分ほどのお好み診断で一緒に見つけます。スマホやタブレットで簡単な質問に答えるだけで、○○様ご家族の暮らし方に合う住まいのタイプが分かります。<span class="ask">せっかくなので、ご夫婦それぞれでやってみませんか？</span>お二人の好みの違いが見えて、会話がはずみますよ」`,
pts:["座りっぱなしの中盤で<b>手を動かす参加型ページ</b>。集中力を回復させ、リノベを「自分の話」にする。","<b>ご夫婦それぞれで診断してもらう</b>のがポイント。好みの違いが優先順位ワーク（37〜38）の材料になる。","診断結果は次のモデルルーム見学（23）や物件提案の会話フックに使う。"],
faqs:[{q:"診断って当たるの?",a:"「占いではなく、暮らし方のご希望から傾向を整理するものです。『こういう方向が好きなんだな』という会話のきっかけとして使っていただくと、この後の物件やリノベのイメージがぐっと湧きやすくなります」"}]},

{n:"23", block:"C", title:"リノベーションってどんなもの??（ビフォア・アフタールーム見学）", time:"休憩5分", badges:["rest"],
goal:"リノベの「言葉→体感」変換＋商談中盤のリフレッシュ。モデルルームで実物を見てもらう。",
talk:`「リノベは、見ていただくのが一番早いです。当社、この建物の中にリノベ前のお部屋とリノベ後のお部屋を両方ご用意しているんです。築20年以上の物件が『何もしないとこう』『リノベするとこうなる』を、その場で見比べられます。<span class="ask">見てみませんか？</span>」`,
pts:["<b>本店:ビフォアルーム→アフタールームの順</b>に案内（ビフォアを先に見せると落差が最大化する）。","<b>総曲輪店:アフタールームのみ。</b>ビフォアはタブレット等で実際の施工前写真を見せてから案内する。","案内中は売り込まず、お客様の「へえ!」という感想を引き出す雑談に徹する。","22のお好み診断の結果と絡めて「○○様の好みだとこのアフタールームの雰囲気が近いですね」と繋ぐと効果的。"],
faqs:[{q:"これって実際の物件?",a:"「モデルルームとしてご用意しているお部屋です。使っている建材や設備は実際のリノベで選べるものなので、床材やキッチンの質感をぜひ触って確かめてください」"}]},

{n:"24", block:"C", title:"安心のアフターサービス（建物診断・シロアリ点検）", time:"90秒",
goal:"「築古の不安」への最終回答。スライド11・19から引っ張ってきた伏線をここで全回収する。",
talk:`「先ほど『築20年以上って大丈夫?』というお話がありましたよね。当社では、購入前に当社の建築士が建物診断とシロアリ点検を行います。買った後に雨漏りやシロアリが見つかった…という中古の一番怖い失敗を、買う前に潰します。さらにご希望があれば中古住宅の瑕疵保険にも加入できる場合があります」`,
pts:["お客様が11あたりで口にした<b>不安の言葉をそのまま引用</b>して話し始めると効果が倍増する（「先ほど○○様がおっしゃった…」）。","「建物診断は1件のみ無料」「物件により別途費用の場合あり」は、聞かれる前にこちらから正直に言うと信頼が増す。"],
faqs:[{q:"診断で問題が見つかったらどうなるの?",a:"「補修費用を見積もってリノベ予算に組み込むか、その物件を見送って次を探すかをご相談します。買う前に分かることが最大の価値です」"},{q:"無料は1件だけ?",a:"「建物診断は購入を決める1件に絞って無料で、当社取り扱い物件を基本とさせていただいております。他社物件や、当社取扱いの一部において一件無料の対象外の物件もあり、別途費用が発生する場合があります。候補段階の物件は、内見時に建築士目線の簡易チェックでスクリーニングしますのでご安心ください」"}]},

/* ================= BLOCK D ================= */
{n:"25", block:"D", title:"マイホームの買い時っていつ!? → 答えは「今です」", time:"2分半",
goal:"「買いたい×買いどき」フレームで整理した上で、健康・金利・価格の3つの理由から「答えは今」に着地させる。",
talk:`「よく『買い時っていつですか?』と聞かれます。ご結婚・出産・ご入学・転勤・家賃がもったいない、といった○○様の『買いたい』事情と、市場の『買いどき』が重なったときが買い時です。<span class="ask">○○様が今日お越しくださったきっかけは、どんなことだったんですか？</span>（→ヒアリング・必ずメモ）実は、市場側の『買いどき』はもう答えが出ていて…<b>今なんです</b>。理由は3つあります。①健康。住宅ローンは団信という生命保険に入れないと借りられません。体に不具合が出てからでは審査が通らない。年齢を重ねるほどリスクは上がるので、健康な今が一番借りやすい。②低金利。バブル期の5.5%に比べれば今の金利はまだ安い水準です。しかも今は円安で、円の価値を守るためには日銀は金利を下げられない。つまり今後下がる可能性は低い。③価格高騰前。物価は原則右肩上がりで、富山市の中古住宅も実際に上がり続けています（→32で証明）。健康・金利・価格、3つとも『待つほど条件が悪くなる』方向なんです」`,
pts:["<b>①健康は損得でなく「借りられるか借りられないか」の話</b>なので最初に置くと重い。次の26（団信）への伏線になる。","②は「下がるのを待つ」という最頻出の先延ばし理由を円安ロジックで先回りして潰す。","③の詳細証拠は27〜32で全部見せるので、ここでは断言だけして深入りしない。","<b>「きっかけ」の回答は41のクロージングで必ず引用する最重要ヒアリング項目。</b>","スライド上のキーワード（結婚・出産・就学・転勤・家賃がもったいない／健康状態・低金利・価格高騰前・団信）を指しながら話すと分かりやすい。"],
faqs:[{q:"健康ならいつでも借りられるでしょ?",a:"「それが、健康診断の再検査1つ、血圧の薬1つで審査が厳しくなるケースが実際にあるんです。『借りられるうちに借りる』は住宅ローンの鉄則です（→26・34で詳しく）」"},{q:"金利、そのうち下がるんじゃ?",a:"「バブル後の30年は下がり続けましたが、今は円安対策で日銀が利上げに転じた局面です。円高にしたい以上、金利を下げる選択は取りにくい。少なくとも『下がるのを待つ』が合理的な状況ではなくなりました（→42〜44の証拠資料）」"}]},

{n:"26", block:"D", title:"団体信用生命保険について（家族への保険）", time:"2分",
goal:"「持ち家=家族への生命保険」という大義名分を渡し、配偶者（同席者）の心を動かす。※旧31から前倒しされ、25「健康だから今」の直後に配置。",
talk:`「25で『健康なうちに』というお話をしましたが、それが一番効いてくるのがこれです。住宅ローンには団体信用生命保険、団信が必ずついてきます。万が一、借りたご本人に何かあったら、ローンは保険で完済。ご家族はそのまま住み続けられて支払いはゼロ。売れば保険金代わりになり、貸せば収入源にもなる。賃貸だと、大黒柱を失った上に家賃は払い続けなければなりません。『万が一のときでも、今の生活が変わらないで済む』。それが団信の保証です。実は家を買う一番の理由にこれを挙げる方も多いんです」`,
pts:["25の「①健康だから今」の根拠がこのページ。<b>「健康なうちに団信に入る=家族を守る」で理屈と情緒を両取り</b>する。","同席の<b>配偶者に視線を配りながら</b>話す（団信が最も刺さるのは配偶者）。","賃貸(収入源が消える・家賃負担が続く)と持家(完済・売却・賃貸で収入源)を対比するスライド構成をなぞる。","生命保険の見直し（家を買ったら死亡保障を減額できる）に触れると「実質負担はさらに軽い」まで繋がる。"],
faqs:[{q:"健康に不安があって団信に入れるか心配…",a:"「持病があっても入れるワイド団信という選択肢もあります。ここは事前審査で確認できるので、まさに早めの審査が大事なんです（→33への橋渡し）」"},{q:"賃貸でも生命保険に入ってれば同じでは?",a:"「同じ保障を民間の生命保険で用意すると、月々数千円〜1万円超の保険料がかかります。団信は金利に含まれているので、実質『保険料込みの支払い』なんです」"}]},

{n:"27", block:"D", title:"低金利の時代（フラット35金利推移）", time:"90秒",
goal:"「歴史的低金利の最終盤にいる。ただし既に上昇が始まっている」という位置認識を持ってもらう。",
talk:`「ここからは25で触れた『②金利』の話です。これが過去40年以上の住宅ローン金利の推移です。バブル期は5.5%。それが長い間下がり続けて、ここ数年が底でした。ただ、グラフの右端を見てください。長期固定金利は5年間の最低金利を脱して、もう上昇基調に入っているんです。今の最頻金利3.21%というのは、40年の歴史で見ればまだ低い水準ですが、『底は過ぎた』というのが正直なところです。<span class="ask">○○様、金利が1%上がると支払いがどれくらい変わるか、ご存じですか？</span>」`,
pts:["「今が底!」と煽らず<b>「底は過ぎたがまだ低い」と正直に言う</b>方が信頼される（グラフがそれを証明してくれる）。","バブル期5.5%は親御さん世代の実体験と繋がるので「ご両親が家を買われた頃は…」という振り方も有効。","最後のクイズ的質問で次ページへの興味を作る。"],
faqs:[{q:"また下がるのを待った方がよくない?",a:"「可能性はゼロではありませんが、日銀は利上げ方向に舵を切っています（→42の参考資料）。それに待っている間も家賃は払い続けることになります。『下がるかもしれない金利』と『確実に出ていく家賃』、どちらが重いかですね」"}]},

{n:"28", block:"D", title:"金利が1%上がると…（600万円の損）", time:"2分",
goal:"金利1%=600万円以上の損、を体感してもらい「金利が低いうちに借りる」ことを緊急課題にする。",
talk:`「答えはこちらです。2,500万円を35年で借りた場合、今の金利3.21%なら月々9.9万円・総額4,165万円。もし1%上がって4.21%になると、月々11.4万円・総額4,782万円。<b>同じ家なのに600万円以上多く払う</b>ことになります。ちなみに2000年の5.5%だったら総額5,639万円、今より1,400万円以上も高い。月々1.5万円の差は、リノベでいうとキッチンを最上位グレードにできる金額です。物件価格の値引き交渉で600万円引かせるのはほぼ不可能ですが、金利が低いうちに借りるだけで同じ効果があるんです」`,
pts:["「600万円の損」を<b>「キッチン最上位グレード」「車1台分」などお客様の欲しいものに換算</b>して伝える。","<b>「値引き600万は無理でも、早く借りれば同じ効果」</b>はこのページ最強のキラートーク。","借入条件（フラット35・北陸銀行・35年）とセットで正直に示す。"],
faqs:[{q:"変動金利ならまだ0.5%くらいでしょ?",a:"「はい、変動は今も低いです。ただ変動金利は日銀の政策金利に連動していて、その日銀が31年ぶりに利上げしました（→42へ）。変動で借りる方こそ『いつ上がるか』を見ておく必要があるんです」"}]},

{n:"29", block:"D", title:"住宅ローン一本化とは（月2.9万円の差）", time:"2分半",
goal:"「物件＋リノベを住宅ローン1本で借りると月2.9万円得」を理解してもらい、購入時にリノベも同時に決めるべきという合理性に接続する。※旧24からブロックDの金利パートへ移動。",
talk:`「金利の話のついでに、もう一つお得な話を。リノベ費用を別のリノベーションローンで借りると金利2.625%・15年。当社提携銀行の住宅ローンなら0.38%・35年。分けて組むと、当初は二重ローンで月々63,579円、リノベローンが終わる16年目まで負担が重い。ところが物件とリノベをまとめて1本（2,500万円）にすると月々45,777円。当初の差はなんと月2.9万円以上です。年間35万円、10年で350万円。ただしこの一本化、物件購入とリノベ計画を同時に進めないと使えません。だから当社は最初からセットでご提案しているんです」`,
pts:["28（金利は上がる）→29（低金利の住宅ローンにまとめれば得）と<b>金利の話が一本の坂道</b>になるよう繋ぐ。","<b>「月2.9万円→年35万→10年350万」</b>と積み上げる話法が効く。","「後からリノベ」を選ぶと損する構造を伝えることで、ワンストップが営業都合でなくお客様利益だと証明する。","銀行名は口頭で聞かれたら答えてよいが、スクリプト上は「提携銀行」で統一（金利・銀行名は巻末の更新一覧で管理）。"],
faqs:[{q:"0.38%ってどこの銀行?どういう金利?",a:"「地元の提携銀行の選択型固定金利です。○○様の条件やご希望（変動か固定か）に合わせて複数の銀行から一番合うものをご提案します。詳しくは資金計画のときに最新の金利表でご説明しますね」"},{q:"数年住んでからリノベしたくなったら?",a:"「可能ですが、その時点の金利・年齢での借入になり、事務手数料や抵当権設定費用もまたかかります。トータルでは購入時一本化が確実にお得です」"}]},

{n:"30", block:"D", title:"国も中古×リフォームを応援（住宅ローン減税）", time:"90秒",
goal:"「そのまま中古は10年のまま。省エネ（性能向上）リフォームで新築並みの13年＋上限増額」という条件差を正確に伝え、当社の中古×リノベがそのまま満額優遇に乗れることを示す。",
talk:`「実は国も、当社と同じことを言い始めています。2026年の税制改正で、中古住宅の住宅ローン減税が新築住宅並みに手厚くなりました。ただしここ、正確にお伝えしますね。<b>控除期間が10年→13年に延びるのも、元本上限金額が引き上げられるのも、性能向上リフォームをした中古住宅を購入した場合</b>なんです。つまり国は『中古を買うならリフォームもセットでやりなさい、そうすれば新築並みに優遇します』という制度設計にしたんです。当社の中古×リノベは、まさにこの優遇にそのまま乗れる買い方です」`,
pts:["<b>「性能向上リフォームをしてこそ13年＋上限増額」の条件差がこのページの武器。</b>そのままの中古・リノベ済み再販との差別化に直結する（＝リノベするからこそ満額優遇）。","制度の細かい要件説明に入り込まない（「別途、諸条件を満たす必要があります」で留め、詳細は資金計画時に）。","「国がリフォーム込みを優遇」→「当社モデルと一致」の流れで締める。"],
faqs:[{q:"性能向上リフォームって何をすればいいの?",a:"「断熱窓への交換や断熱材の追加、高効率給湯器などです。当社のリノベプランに組み込めますので、減税要件を満たす仕様は資金計画のときに一緒に確認しましょう」"},{q:"ローン減税って実際いくら戻るの?",a:"「年末ローン残高の0.7%が13年間、所得税等から控除されます。○○様の借入額での試算は、この後の資金計画で具体的な数字をお出ししますね」"}]},

{n:"31", block:"D", title:"富山市も中古×リフォームを応援（補助金）", time:"90秒",
goal:"「富山市は新築補助を廃止し中古のみに」という地元の決定的事実で、背中を押す。",
talk:`「国だけじゃありません。富山市はもっとはっきりしています。2026年度から、まちなか・公共交通沿線中古住宅取得等支援事業が改正されて、<b>新築購入への補助は廃止</b>。補助金は中古住宅の取得とリフォームだけになりました。しかもこれまで必要だった住宅ローン利用要件がなくなって現金購入でも対象に、戸建ての敷地内緑化要件も廃止、金額も増額。富山市が税金の使い道として『中古×リフォーム』を選んだということです。使える補助金を使わない手はありません」`,
pts:["30（国）→31（市）と主語を近づけていくことで「自分の話」になっていく。","<b>「新築補助は廃止」は富山でこの提案をする上で最強のファクト。はっきり・ゆっくり言う。</b>","対象エリア判定は物件ごとに必要なので深入りせず「候補物件が出たら当社で対象か確認します」と引き取る。"],
faqs:[{q:"いくらもらえるの?",a:"「物件の場所や条件で変わるため、候補物件ごとに当社が対象可否と金額を確認してご案内します。使える制度は漏れなく使う、が当社の方針です（※金額詳細は巻末更新一覧で管理）」"},{q:"うちの狙ってるエリアは対象?",a:"「地図で確認しましょう。公共交通沿線はかなり広く指定されているので、対象になるケースは多いですよ」"}]},

{n:"32", block:"D", title:"富山市の中古住宅の相場（上昇中）", time:"90秒",
goal:"「待つほど高くなる」を地元データで証明し、先延ばしのコストを認識してもらう。",
talk:`「『もう少し待てば中古も安くなるんじゃ?』と思われるかもしれません。実際は逆で、富山市の中古住宅は直近3年でマンションが13.00%、戸建てが4.47%上昇しています。2,000万円のマンションなら3年で260万円の値上がりです。理由はシンプルで、新築が高くなりすぎて中古に買い手が集まっているから。つまり…今日ご説明してきた『みんなが中古×リノベに動く』流れそのものが、価格を押し上げているんです。値下がりする気配がない状況で、金利も価格も上がる局面では、待つことがそのままコストになります」`,
pts:["27〜28（金利上昇）×32（価格上昇）の<b>ダブルパンチで「待つ=損」を完成</b>させるページ。25の「③価格高騰前」の回収。","%ではなく<b>金額換算（13%→260万円）</b>で話す。","「新築高騰→中古に需要シフト」という因果を語れると、煽りではなく市場分析として聞こえる。"],
faqs:[{q:"上がってるなら今買ったら高値掴みでは?",a:"「良い視点です。ただ思い出してください、築21年以降の物件は価格が下げ止まった商品でしたよね（→13の復習）。上昇局面の築古は『高値掴み』ではなく『さらに資産価値が守られる』方向に働きます。怖いのはむしろ、高値の新築や築浅を買うことです」"}]},

/* ================= BLOCK E ================= */
{n:"33", block:"E", title:"大切な事前審査（AさんBさんの例）", time:"90秒",
goal:"「事前審査=物件を買う前に全員がやる当たり前の手続き」と認識してもらい、審査への心理的抵抗を下げる。",
talk:`「ここからは、今日から動ける実務の話です。<span class="ask">○○様、事前審査ってお聞きになったことありますか？</span>自分が銀行からいくら借りられるかを先に確認しておく審査で、住宅ローンを使う方は皆さん必ずやるものです。例えばこの2人。Aさんは28歳・勤続6年・年収450万・自己資金100万。Bさんは32歳・勤続10年・年収550万・自己資金200万でお子様1人。どちらも2,800万円を借りたい。一見、Bさんの方が余裕で通りそうですよね?…実はこの後、意外な結果になるんです」`,
pts:["<b>「皆さんやるものです」と当たり前化</b>するのが最大の目的（審査=疑われている、という感覚を消す）。","AさんBさんはクイズ形式で引っ張り、答えは次ページまで言わない。","スライドの属性（年齢・勤続・年収・自己資金・家族構成）を指しながら話す。"],
faqs:[{q:"審査って落ちたら記録に残るんでしょ?",a:"「事前審査の結果が信用情報に長く残って不利になる、ということは基本的にありません。むしろ早めに確認して、問題があれば対策する時間を作る方がずっと大事です」"}]},

{n:"34", block:"E", title:"大切な事前審査（結果と5つのポイント）", time:"2分半",
goal:"「審査は年収だけでは決まらない。自分では気づけない落とし穴がある」と理解し、「早く確認しないと怖い」という感覚を持ってもらう。",
talk:`「結果は、Aさんが2,800万円で承認。年収の高いBさんはまさかの否認でした。理由は、本人も気づいていなかったクレジットカードの支払い忘れです。審査のポイントは5つ。①申込時年齢と完済時年齢…50歳で35年ローンは組みにくい等。②年収と返済期間・返済負担率。③勤続年数と雇用形態…一般に勤続2年以上、派遣・契約は対象外になる傾向。④借金の状況…カードローンや車のローン、スマホの分割払いもここに入ります。⑤健康状態…団信ですね。怖いのは④と⑤で、<b>自分では大丈夫と思っていても引っかかるケースがある</b>こと。Bさんのように、家づくりの話を進めた後で発覚すると、全部やり直しになってしまいます。もっと早く出しておけば…となる前に、です」`,
pts:["<b>「スマホの分割払いも借金扱い」は必ず言う</b>（若い世代のひっかかり第1位で、知らない人が多い）。","⑤健康はスライド25・26の「今のうちに」と接続。","「Bさんはもっと早く審査しておけば…」という後悔ストーリーで締めると次ページの「早く出す」に繋がる。"],
faqs:[{q:"過去に支払い遅れがあったかも…どうすれば?",a:"「正直にご相談いただければ大丈夫です。信用情報はご自身で開示請求もできますし、状況に合わせて通りやすい銀行をご提案できます。一人で悩まず、まず審査に出して現在地を知るのが一番です」"},{q:"年収の何倍まで借りられるの?",a:"「目安は返済負担率で年収の25〜35%以内ですが、大事なのは『借りられる額』より『無理なく返せる額』です。資金計画でご家庭の数字から逆算しましょう（→スライド5の回収）」"}]},

{n:"35", block:"E", title:"事前審査は「物件が見つかってから」では遅い（買う権利）", time:"90秒",
goal:"「事前審査済み=物件を買う権利」と理解し、「良い物件を探す前に審査」の順番を受け入れてもらう。",
talk:`「『審査は良い物件が見つかってからでいいや』と思われるかもしれません。実はそれ、一番もったいないパターンなんです。人気物件には複数の買いたい人が集まって取り合いになります。<span class="ask">売主さんの立場で考えてみてください。『買いたいです、でもローンが通るかまだ分かりません』という人と、『審査済みです、確実に買えます』という人、それに現金の人。どなたに売りたいですか？</span>…そうなんです。今年中に家を買いたいなら、<b>購入する権利を先に持っておく</b>ことが大切なんです。事前審査していないと、良い物件が出ても買えないかもしれません」`,
pts:["<b>「売主の立場で考えてみてください」と視点を切り替えさせる質問</b>がこのページの核。","「買う権利」という言い換えで、審査=面倒な手続き→審査=武器へ意味を反転させる。","スライドのA・B・C＋現金客の構図を使い、審査済みが選ばれることを視覚的に。"],
faqs:[{q:"審査が通ったら必ず買わないといけないの?",a:"「いいえ、事前審査はあくまで『借りられる状態の確認』です。買う義務は一切ありません。ノーリスクで買う権利だけ持てる、と考えてください」"}]},

{n:"36", block:"E", title:"事前審査のややこしさ → だから当社がお手伝い", time:"3分", badges:["close"],
goal:"「必要書類が煩雑＋結果まで最短3日」という現実を見せた上で、「当社がお手伝いするので今日進めてしまうのが一番」に落とす。本日の実質クロージングポイント。",
talk:`「事前審査にはメリットがあります。①総額が明確で計画が立てやすい、②売主様に後回しにされない、③購入条件の交渉がしやすくなる。ただ、正直に言うと必要書類がかなり煩雑なんです。給与所得の方なら源泉徴収票、健康保険証、免許証、認め印、他のローンがあればその資料。事業主の方なら確定申告書・決算書も。しかも結果が出るまで最短3日程度かかります。この3日の間に狙っていた物件が売れてしまうこともある。だから当社では、書類集めから全部サポートして、早めに審査を出してしまうことをおすすめしています。<span class="ask">○○様、この後、事前審査の進め方をご案内させてください。</span>」`,
pts:["<b>「審査しませんか?」ではなく「進め方をご案内させてください」とハードルを最小化</b>して切り出す。","メリット3点（計画・後回しにされない・交渉力）を先に言ってから、煩雑さ→当社が手伝う、の順。","<b>【標準フロー】事前審査を先に完了させてから物件案内（→41参照）。</b>"],
faqs:[{q:"今日は書類を持ってきていない…",a:"「ご安心ください。当社の事前審査はWebから入力いただく形なので、書類を今日お持ちでなくても大丈夫です。審査用のURLをお送りしますので、お手元のスマホから本日中に入力をお願いします。分からないところは当社がサポートします。源泉徴収票などはあとから写真で送っていただく形でも進められます」"},{q:"どこの銀行に出すの?",a:"「結果が早い北国銀行を基本にご案内しています。ご状況によっては他の提携行もご提案できますので、まずは審査に出して現在地を知るのが一番です」"}]},

{n:"37", block:"E", title:"優先順位を付けよう（100%の物件はない・掘り出し物件の真実）", time:"2分",
goal:"「完璧な物件を待つ」「掘り出し物件を待つ」という2大先延ばしパターンを潰し、「優先順位で選ぶ」という物件の見方をインストールする。",
talk:`「物件の探し方のコツを一つだけ。最初に正直にお伝えします。<b>ご希望に100%合う物件は、ありません</b>。希望の場所と希望の金額はマッチしないですし、あれもこれも選ぶと失敗の要因になります。特に人気エリアは価格が高くて物件数が少なくて、すぐ売れる。それから、よく『掘り出し物件が出るまで待ちます』という方がいらっしゃるので、これも正直にお話しします。<b>掘り出し物件は、実は存在するんです</b>。借金にお困りの方や、相続の財産分与をお急ぎの方などが『安くてもいいから早く現金化したい』と売却されるケースです。ただ、そういう物件はご相談を受けた私たち不動産会社が買い取って、リノベして市場価格で再販売する流れになるので、一般の方には出回りません。競売で買う方法もありますが、原則現金一括で室内も見られない世界なので、一般の方にはハードルが高すぎます。つまり、市場に出ている物件の中から優先順位で賢く選ぶのが現実的な最適解なんです」`,
pts:["「100%はない」をプロが最初に断言することで、後の物件紹介時の迷いに対処しやすくなる（期待値コントロール）。","<b>掘り出し物件トークは業界の裏側の種明かしなので信頼構築効果大。</b>「存在しません」と嘘をつかず「存在するが一般には出回らない」と正直に言うのがポイント。売主を揶揄する口調にはしない。","リノベの強みを添える:「内装・間取りはリノベで変えられるので、変えられない立地・広さ・価格に優先順位を絞れるのが中古×リノベの強みです」"],
faqs:[{q:"競売って安く買えるんでしょ?",a:"「確かに相場より安いです。ただ原則現金一括、室内は見られない、場合によっては住んでいる方との立ち退き交渉も自分でやることになります。プロでも失敗する世界なので、一般の方にはおすすめしていません」"},{q:"妥協して買って後悔しない?",a:"「妥協ではなく取捨選択です。それに思い出してください、資産価値が下がらない物件なら住み替えという選択肢が残ります（→14の回収）。『一生に一度の完璧な買い物』と思い詰めなくていいんです」"}]},

pts:["<b>必ずその場でペンを持ってもらう</b>（書く行為が購入プロセスへの参加意識を作る）。","22のお好み診断でご夫婦の好みの違いが出ているはずなので、それを踏まえて優先順位を整理すると繋がりが良い。","夫婦で優先順位が割れたら宝の山（「ご主人は駐車場2台、奥様は学区なんですね」と両方メモ）。"],

{n:"39", block:"E", title:"実際の物件を見てみましょう＋スピードが大切", time:"90秒",

{n:"40", block:"E", title:"購入の流れ（全12ステップ・入居日から逆算）", time:"2分",
goal:"契約から入居までの全行程と期間感を見せ、「知らない道」への不安を消す。ゴール（入居日）から逆算させる。",
talk:`「最後に、この先の道のりを全部お見せします。①ご相談→②資金計画→③現地のご案内・物件紹介（約2週間）→④リノベプランお見積もり提案（約1週間）→⑤ご購入お申し込み→⑥不動産売買契約・リノベ請負契約→⑦住宅ローン本申し込み→⑧リノベプラン・お見積もり確定（約1週間）→⑨金銭消費貸借契約→⑩物件の引き渡し・残代金支払い（約3週間）→⑪リノベーション工事（約1〜1.5ヶ月）→⑫完成・ご入居。ざっくり言うと、<b>物件が決まってからご入居まで約3〜4ヶ月</b>です。ここで逆算してみましょう。<span class="ask">○○様、いつ頃から新居に住みたいですか？</span>（→回答）だとすると、物件を決めるのは○月頃、つまり物件探しを本格化するのは…今なんです」`,

const rail = document.getElementById("rail");
function buildRail(){
  const B = DATA().BLOCKS;
  rail.innerHTML = "";
  ["A","B","C","D","E"].forEach(k=>{
    const b = B[k];
    rail.insertAdjacentHTML("beforeend",
      `<div class="stage"><div class="t">${k}｜${b.name}</div><div class="m">${b.min}</div><div class="bar"><i style="width:${b.pct}%"></i></div></div>`);
  });
}

const tabs = document.getElementById("tabs");
let curTab = "ALL";
function buildTabs(){
  tabs.innerHTML = "";
  curTab = "ALL";
  DATA().tabDefs.forEach(([k,label])=>{
    const el = document.createElement("button");
    el.className = "tab" + (k==="ALL"?" active":"");
    el.textContent = label;
    el.onclick = ()=>{ curTab = k;
      document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
      el.classList.add("active"); applyFilter(); };
    tabs.appendChild(el);
  });
}

let curMode = "buy";
function DATA(){
  return curMode==="buy"
    ? {BLOCKS:BLOCKS, SLIDES:SLIDES, UPDATES:UPDATES,
       tabDefs:[["ALL","すべて"],["A","A 導入"],["B","B 合理性"],["C","C 強み"],["D","D 買い時"],["E","E 審査〜CL"],["R","参考資料"],["U","巻末"]]}
    : {BLOCKS:BLOCKS_SELL, SLIDES:SLIDES_SELL, UPDATES:UPDATES_SELL,
       tabDefs:[["ALL","すべて"],["A","A 信頼"],["B","B 会社選び"],["C","C 販売力"],["D","D 安心"],["E","E 価格・CL"],["R","参考資料"],["U","巻末"]]};
}

const BADGE = {insert:"差し込み（必要時のみ）", close:"クロージング", rest:"休憩・体感タイム", custom:"各自カスタム"};
const main = document.getElementById("main");

function cardHTML(s){
  const badges = (s.badges||[]).map(b=>`<span class="chip ${b}">${BADGE[b]}</span>`).join("");
  const pts = s.pts && s.pts.length ? `<div class="sec"><div class="lab">重要ポイント</div><ul class="pts">${s.pts.map(p=>`<li>${p}</li>`).join("")}</ul></div>` : "";
  const faqs = s.faqs && s.faqs.length ? `<div class="sec"><div class="lab">よくある質問と回答例</div>${s.faqs.map(f=>`<details class="faq"><summary>${f.q}</summary><div class="a">${f.a}</div></details>`).join("")}</div>` : "";
  return `<article class="card" data-block="${s.block}">
    <div class="card-h">
      <div class="num"><span class="l">SLIDE</span><span class="n">${s.n}</span></div>
      <div class="ttl"><h3>${s.title}</h3>
        <div class="meta"><span class="chip time">⏱ ${s.time}</span>${badges}</div>
      </div>
    </div>
    <div class="card-b">
      <div class="sec goal"><div class="lab">このページのゴール</div><div class="goal"><p>${s.goal}</p></div></div>
      <div class="sec"><div class="lab">トーク例</div><div class="talk">${s.talk}</div></div>
      ${pts}${faqs}
    </div>
  </article>`;
}

function render(){
  const D = DATA(); const SLIDES = D.SLIDES, BLOCKS = D.BLOCKS, UPDATES = D.UPDATES;
  let html = "";
  const order = ["A","B","C","D","E","R"];
  order.forEach(k=>{
    const items = SLIDES.filter(s=>s.block===k);
    if(!items.length) return;
    html += `<div class="blockhead" data-block="${k}"><span class="bk">${k==="R"?"参考":k}</span><h2>${BLOCKS[k].name}</h2><span class="bmin">${BLOCKS[k].min}</span></div>`;
    html += items.map(cardHTML).join("");
  });
  const memoBuy = `・口調は「です・ます＋会話的」。理念や表の音読はしない。<br>
    ・オレンジ下線の質問は省略禁止。お客様の回答は必ずメモし、25の「きっかけ」は40で引用する。<br>
    ・再販物件の棲み分けトーク:「お急ぎの方・打合せが面倒な方には再販／時間がある方・自分らしいオリジナルの家を作りたい方には中古×リノベ」。自社再販在庫を否定しない。<br>
    ・標準フロー:初回面談 → Web事前審査（本日中・結果の早い北国銀行）→（面談から約1週間後）物件案内。<b>審査完了前の現地案内はしない。</b><br>
    ・参考資料（S10・S41-44）はお客様から疑問が出たときだけ開く。`;
  const memoSell = `・口調は「です・ます＋会話的」。理念や表の音読はしない。<br>
    ・オレンジ下線の質問は省略禁止。売主様の回答は必ずメモする。<br>
    ・<b>合言葉は「査定額の高さで勝負しない」。</b>初めて売る方の不安を解くことが最優先。<br>
    ・コアページ（P7・P9・P29・P39・P71・P74・P87・P95）はしっかり話す。参考ページは「詳しくはこちらの資料を」とめくるだけ。<br>
    ・二大山場は<b>P9（査定額の罠）とP87（囲い込み問題）</b>。ここで腑に落ちると全体が刺さる。<br>
    ・値下げは「売れない言い訳」ではなく、P75・P81で事前に共有した「戦略」として提案する。<br>
    ・ドローン撮影は有料（2万円＋税）、補修費は売主負担。聞かれたら正直に答える。<br>
    ・最後は「強引には勧めません、じっくりご検討ください」と添えて押しつけ感をなくす。`;
  html += `<div class="blockhead" data-block="U"><span class="bk">巻末</span><h2>${BLOCKS.U.name}</h2></div>
  <div class="upd" data-block="U">
    <h3>数字更新一覧</h3>
    <div class="asof">現在の記載値:2026年7月時点。市況・制度改定のたびにここを確認し、該当スライドとスクリプトを同時に更新すること。</div>
    <table><thead><tr><th>スライド</th><th>項目</th><th>現在の値・内容</th></tr></thead>
    <tbody>${UPDATES.map(u=>`<tr><td class="s">${u[0]}</td><td>${u[1]}</td><td>${u[2]}</td></tr>`).join("")}</tbody></table>
    <div class="memo"><b>運用メモ（全スタッフ共通ルール）</b><br>
    ${curMode==="buy"?memoBuy:memoSell}</div>
  </div>`;
  main.innerHTML = html;
}

function applyFilter(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  let visible = 0;
  document.querySelectorAll("#main .card").forEach(c=>{
    const okTab = curTab==="ALL" || c.dataset.block===curTab;
    const okQ = !q || c.textContent.toLowerCase().includes(q);
    const show = okTab && okQ;
    c.classList.toggle("hidden", !show);
    if(show) visible++;
  });
  document.querySelectorAll("#main .blockhead, #main .upd").forEach(el=>{
    const k = el.dataset.block;
    if(k==="U"){
      el.classList.toggle("hidden", !(curTab==="ALL"||curTab==="U") || !!q && !el.textContent.toLowerCase().includes(q));
      return;
    }
    const anyVisible = [...document.querySelectorAll(`#main .card[data-block="${k}"]`)].some(c=>!c.classList.contains("hidden"));
    el.classList.toggle("hidden", !anyVisible);
  });
  const cnt = document.getElementById("count");
  const total = DATA().SLIDES.length;
  const refCount = DATA().SLIDES.filter(s=>s.block==="R").length;
  cnt.textContent = q || curTab!=="ALL" ? `表示中:${visible}枚（全${total}枚）` : `全${total}枚を表示中（参考資料${refCount}枚を含む）`;
  const empty = document.getElementById("empty");
  if(empty) empty.remove();
  if(visible===0 && curTab!=="U"){
    main.insertAdjacentHTML("beforeend",`<div class="empty" id="empty">「${q}」に一致するスクリプトはありません。<br>キーワードを短くするか、タブを「すべて」に戻してください。</div>`);
  }
}

document.getElementById("q").addEventListener("input", applyFilter);
window.addEventListener("beforeprint", ()=>document.querySelectorAll("details.faq").forEach(d=>d.open=true));

function switchMode(mode){
  curMode = mode;
  document.querySelectorAll(".modebtn").forEach(b=>b.classList.toggle("active", b.dataset.mode===mode));
  document.getElementById("q").value = "";
  buildRail();
  buildTabs();
  render();
  applyFilter();
  window.scrollTo({top:0, behavior:"smooth"});
}
document.querySelectorAll(".modebtn").forEach(b=>{
  b.addEventListener("click", ()=>switchMode(b.dataset.mode));
});

// 初期描画
buildRail(); buildTabs(); render(); applyFilter();
</script>
</body>
</html>
